[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
norecursedirs = .git .tox dist build *.egg __pycache__ .venv venv node_modules

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-config=.coveragerc
    -p no:warnings

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    contract: Contract tests (API endpoint validation)
    slow: Slow running tests
    web: Tests requiring web scraping/network access

# Coverage settings (referenced from .coveragerc)
# See .coveragerc for detailed coverage configuration
