[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
testpaths = tests
norecursedirs = .git .tox dist build *.egg __pycache__ .venv venv node_modules
addopts = -v --strict-markers --tb=short -W ignore::pytest.PytestDeprecationWarning -W ignore::DeprecationWarning
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Unit tests
    integration: Integration tests  
    contract: Contract tests
    slow: Slow running tests
    web: Tests requiring web scraping
