<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Quizify</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .auth-btn {
            width: 100%;
            padding: 0.75rem;
            margin-top: 1rem;
        }
        
        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
        }
        
        .auth-toggle {
            color: var(--primary-color);
            cursor: pointer;
            font-weight: 500;
        }
        
        .auth-toggle:hover {
            text-decoration: underline;
        }
        
        .auth-error {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 0.75rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
            display: none;
        }
        
        .auth-success {
            background-color: #d1fae5;
            color: #065f46;
            padding: 0.75rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
            display: none;
        }
        
        .auth-section {
            min-height: calc(100vh - 150px);
            display: flex;
            align-items: center;
            background-color: var(--light-bg);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <h2>Quizify</h2>
                </div>
                <div class="menu-toggle" id="menu-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <ul class="nav-links" id="nav-links">
                    <li><a href="/">Home</a></li>
                    <li><a href="/#features">Features</a></li>
                    <li><a href="/#cta">Get Started</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="auth-section">
        <div class="container">
            <div class="auth-container">
                <div class="auth-header">
                    <h2>Sign Up</h2>
                    <p>Sign up to start your quiz journey</p>
                </div>
                
                <div class="auth-error" id="auth-error">
                    Error message will appear here
                </div>
                
                <div class="auth-success" id="auth-success">
                    Account created successfully! You can now login.
                </div>
                
                <form class="auth-form" id="signup-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" required placeholder="••••••••" minlength="6">
                    </div>
                    
                    <button type="submit" class="btn btn-primary auth-btn">Create Account</button>
                </form>
                
                <div class="auth-footer">
                    <p>Already have an account? <a href="/api/auth/login_page" class="auth-toggle" id="to-login">Sign in</a></p>
                </div>
            </div>
        </div>
    </section>
    
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 Quizify. All rights reserved.</p>
            </div>
        </div>
    </footer>
    
    <script src="/static/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const signupForm = document.getElementById('signup-form');
            const authError = document.getElementById('auth-error');
            const authSuccess = document.getElementById('auth-success');
            const toLogin = document.getElementById('to-login');
            
            signupForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                
                // Reset messages
                authError.style.display = 'none';
                authSuccess.style.display = 'none';
                
                // Validate passwords match
                if (password !== confirmPassword) {
                    authError.style.display = 'block';
                    authError.textContent = 'Passwords do not match.';
                    return;
                }
                
                try {
                    const response = await fetch('/api/auth/signup', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        // Show success message
                        authSuccess.style.display = 'block';
                        signupForm.reset();
                        
                        // Redirect to login after a short delay
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 3000);
                    } else {
                        // Show error
                        authError.style.display = 'block';
                        authError.textContent = data.detail || 'Signup failed. Please try again.';
                    }
                } catch (error) {
                    console.error('Signup error:', error);
                    authError.style.display = 'block';
                    authError.textContent = 'An error occurred. Please try again later.';
                }
            });
            
            toLogin.addEventListener('click', function() {
                window.location.href = '/login';
            });
        });
    </script>
</body>
</html>
